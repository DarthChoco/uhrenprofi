<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uhren-Profi – Uhrzeit lernen</title>
<style>
  :root{
    --bg1:#fff3d6; --bg2:#d9ecff; --ink:#2b2d42; --card:#ffffff;
    --hour:#e63946; --min:#4361ee; --good:#2a9d4a; --bad:#e63946; --accent:#ff9f1c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
    -webkit-tap-highlight-color:transparent;
  }
  main{max-width:600px;margin:0 auto;padding:16px 14px 40px}
  h1{text-align:center;font-size:2rem;margin:10px 0 4px}
  .sub{text-align:center;margin:0 0 20px;opacity:.8}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 18px;background:var(--min);color:#fff;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  button.big{width:100%;font-size:1.3rem;padding:16px;background:var(--good);margin-top:14px}
  .menu-btn{display:block;width:100%;text-align:left;margin:12px 0;padding:18px;font-size:1.25rem}
  .menu-btn small{display:block;font-weight:400;opacity:.9;font-size:.9rem;margin-top:4px}
  .menu-btn.read{background:var(--min)} .menu-btn.set{background:var(--hour)} .menu-btn.mixed{background:var(--accent);color:#2b2d42}
  .best{font-size:.85rem;opacity:.85}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
  .topbar button{padding:8px 12px;font-size:.9rem}
  #prompt{text-align:center;font-size:1.3rem;margin:8px 0}
  #prompt .digital{display:block;font-size:2.6rem;font-weight:800;color:var(--hour);letter-spacing:1px}
  #clockWrap{width:min(86vw,380px);margin:0 auto}
  svg.clock{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
  .legend{display:flex;justify-content:center;gap:16px;font-size:.9rem;margin:6px 0 10px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .trow{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;font-size:1.2rem;font-weight:700;padding:6px;border-radius:14px;border:3px solid transparent}
  .trow input{width:64px;font:inherit;font-size:1.6rem;text-align:center;padding:8px 4px;border:3px solid #b8c4e0;border-radius:12px;background:#fff;color:var(--ink)}
  .trow input:focus{outline:none;border-color:var(--min)}
  .trow.ok{border-color:var(--good);background:#e6f6ea}
  .trow.bad{border-color:var(--bad);background:#fdeaec}
  .trow .lbl{min-width:90px;text-align:right}
  #handBtns{display:flex;gap:10px;justify-content:center;margin:6px 0}
  #handBtns button{flex:1;background:#fff;color:var(--ink);border:4px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  #handBtns button.sel.hour{border-color:var(--hour);background:#fdeaec}
  #handBtns button.sel.min{border-color:var(--min);background:#e8edff}
  #feedback{min-height:2.6em;text-align:center;font-size:1.1rem;font-weight:700;margin-top:8px}
  #feedback.ok{color:var(--good)} #feedback.bad{color:var(--bad)} #feedback.info{color:var(--ink)}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
  .result{text-align:center}
  .stars{font-size:3rem;margin:8px 0}
  .result .pts{font-size:2rem;font-weight:800}
  dialog{border:0;border-radius:20px;padding:20px;max-width:440px;width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h2{margin-top:0}
  .field{margin:14px 0}
  .field label.t{display:block;font-weight:700;margin-bottom:4px}
  .field select,.field input[type=number]{font:inherit;padding:8px;border-radius:10px;border:2px solid #b8c4e0;width:100%}
  .field .range{display:flex;gap:10px;align-items:center}
  .radio{display:block;margin:6px 0;padding:8px 10px;border-radius:10px;border:2px solid #dde3f2}
  .radio input{margin-right:8px}
  .radio small{display:block;opacity:.75;margin-left:26px}
  .dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>

  <!-- MENÜ -->
  <section id="menu">
    <h1>🕒 Uhren-Profi</h1>
    <p class="sub">Lerne die Uhr lesen und stellen!</p>
    <div class="card">
      <button class="menu-btn read" data-mode="read">👀 Uhr lesen
        <small>Du siehst eine Uhr und schreibst die beiden möglichen Uhrzeiten auf.</small></button>
      <div class="best" id="best-read"></div>
      <button class="menu-btn set" data-mode="set">✋ Uhr stellen
        <small>Du siehst eine Uhrzeit und stellst die Zeiger auf der leeren Uhr ein.</small></button>
      <div class="best" id="best-set"></div>
      <button class="menu-btn mixed" data-mode="mixed">🎲 Gemischt
        <small>Lesen und Stellen im Wechsel.</small></button>
      <div class="best" id="best-mixed"></div>
      <div style="text-align:right;margin-top:14px"><button class="ghost" id="btnSettings">⚙️ Einstellungen</button></div>
    </div>
  </section>

  <!-- SPIEL -->
  <section id="game" hidden>
    <div class="topbar">
      <button class="ghost" id="btnQuit">⬅ Menü</button>
      <span id="progress"></span>
      <span id="score"></span>
    </div>
    <div class="card">
      <h2 id="prompt"></h2>
      <div id="clockWrap"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--hour)"></i>Stundenzeiger (kurz)</span>
        <span><i class="dot" style="background:var(--min)"></i>Minutenzeiger (lang)</span>
      </div>

      <div id="readUI" hidden>
        <div class="trow" data-row="0"><span class="lbl">Uhrzeit 1:</span>
          <input class="hh" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Stunde, Uhrzeit 1"> :
          <input class="mm" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Minute, Uhrzeit 1"> Uhr</div>
        <div class="trow" data-row="1"><span class="lbl">Uhrzeit 2:</span>
          <input class="hh" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Stunde, Uhrzeit 2"> :
          <input class="mm" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Minute, Uhrzeit 2"> Uhr</div>
      </div>

      <div id="setUI" hidden>
        <div id="handBtns">
          <button class="hour" data-hand="hour">🔴 Stundenzeiger</button>
          <button class="min" data-hand="min">🔵 Minutenzeiger</button>
        </div>
      </div>

      <div id="feedback" class="info" aria-live="polite"></div>
      <button class="big" id="btnCheck">Prüfen ✔</button>
    </div>
  </section>

  <!-- ERGEBNIS -->
  <section id="result" hidden>
    <div class="card result">
      <h1>Geschafft!</h1>
      <div class="stars" id="stars"></div>
      <div class="pts" id="finalScore"></div>
      <p id="finalText"></p>
      <button class="big" id="btnAgain">Nochmal spielen</button>
      <button class="big" id="btnMenu" style="background:var(--min)">Zum Menü</button>
    </div>
  </section>

</main>

<!-- EINSTELLUNGEN -->
<dialog id="dlg">
  <h2>⚙️ Einstellungen</h2>
  <div class="field">
    <label class="t" for="setMinutes">Minuten</label>
    <select id="setMinutes">
      <option value="full">Nur volle Stunden (00)</option>
      <option value="quarter">Viertelstunden (00, 15, 30, 45)</option>
      <option value="five">5-Minuten-Schritte</option>
      <option value="all">Alle Minuten</option>
    </select>
  </div>
  <div class="field">
    <label class="t">Stunden (1–23)</label>
    <div class="range">von <input type="number" id="setHMin" min="1" max="23"> bis <input type="number" id="setHMax" min="1" max="23"></div>
  </div>
  <div class="field">
    <label class="t">Genauigkeit beim Zeiger-Stellen</label>
    <label class="radio"><input type="radio" name="tol" value="easy">Leicht
      <small>Stundenzeiger irgendwo im richtigen Stundenbereich (bei 3:45 zwischen 3 und 4), Minutenzeiger ungefähr.</small></label>
    <label class="radio"><input type="radio" name="tol" value="mid">Mittel
      <small>Stundenzeiger etwa 9° genau, Minutenzeiger ±4 Minuten.</small></label>
    <label class="radio"><input type="radio" name="tol" value="strict">Genau
      <small>Stundenzeiger etwa 4,5° genau, Minutenzeiger ±2 Minuten.</small></label>
  </div>
  <div class="field">
    <label class="t" for="setTotal">Aufgaben pro Runde</label>
    <select id="setTotal"><option>5</option><option>10</option><option>15</option><option>20</option></select>
  </div>
  <div class="dlg-actions">
    <button class="ghost" id="btnReset">Zurücksetzen</button>
    <button id="btnCloseDlg">Fertig</button>
  </div>
</dialog>

<script>
(function(){
'use strict';

/* ---------- Einstellungen ---------- */
const DEF = {minutes:'quarter', hMin:1, hMax:23, tol:'easy', total:10};
let S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem('uhr-settings') || '{}')); } catch(e){}
function saveSettings(){ try{ localStorage.setItem('uhr-settings', JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function stepSize(){ return {full:60, quarter:15, five:5, all:1}[S.minutes]; }
function minuteChoices(){
  const st = stepSize(), out = [];
  for(let m=0;m<60;m+=st) out.push(m);
  return out;
}
const pad = n => String(n).padStart(2,'0');

/* ---------- Prüf-Logik (rein) ---------- */
function evalSet(H, M, hourAngle, minAngle, tol){
  const minutes = Math.round(minAngle/6) % 60;
  let dm = Math.abs(minutes - M); dm = Math.min(dm, 60 - dm);
  const levelTol = {easy:7, mid:4, strict:2}[tol];
  const tolM = Math.min(levelTol, Math.max(stepSize()/2, 1));
  const minOk = dm <= tolM;

  const hp = hourAngle/30;                       // 0..12
  let d = hp - (H % 12);
  d = (((d + 6) % 12) + 12) % 12 - 6;            // [-6, 6)
  let hourOk;
  if(tol === 'easy'){
    hourOk = M > 0 ? (d >= -0.05 && d <= 1.05) : Math.abs(d) <= 0.5;
  } else {
    hourOk = Math.abs(d - M/60) <= (tol === 'mid' ? 0.3 : 0.15);
  }
  return {minOk, hourOk};
}

/* ---------- SVG-Uhr ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

function createClock(container, interactive, cb){
  container.innerHTML = '';
  const svg = el('svg', {viewBox:'-110 -110 220 220', class:'clock'});
  container.appendChild(svg);
  el('circle', {r:104, fill:'#fff', stroke:'#2b2d42', 'stroke-width':4}, svg);
  for(let i=0;i<60;i++){
    const a = i*6*Math.PI/180, big = i%5===0, r1 = big?90:95, r2 = 100;
    el('line', {x1:Math.sin(a)*r1, y1:-Math.cos(a)*r1, x2:Math.sin(a)*r2, y2:-Math.cos(a)*r2,
      stroke:'#2b2d42', 'stroke-width': big?2.5:1}, svg);
  }
  for(let n=1;n<=12;n++){
    const a = n*30*Math.PI/180;
    const t = el('text', {x:Math.sin(a)*74, y:-Math.cos(a)*74+7, 'text-anchor':'middle',
      'font-size':20, 'font-weight':700, fill:'#2b2d42'}, svg);
    t.textContent = n;
  }

  // Lösungs-Anzeige (gestrichelt grün)
  const ghost = el('g', {opacity:0, 'pointer-events':'none'}, svg);
  const gHour = el('g', {}, ghost), gMin = el('g', {}, ghost);
  el('line', {x1:0,y1:0,x2:0,y2:-48, stroke:'#2a9d4a','stroke-width':9,'stroke-linecap':'round','stroke-dasharray':'1 13'}, gHour);
  el('line', {x1:0,y1:0,x2:0,y2:-78, stroke:'#2a9d4a','stroke-width':7,'stroke-linecap':'round','stroke-dasharray':'1 11'}, gMin);

  const hourG = el('g', {}, svg), minG = el('g', {}, svg);
  el('line', {x1:0,y1:0,x2:0,y2:-48, stroke:'#e63946','stroke-width':8,'stroke-linecap':'round'}, hourG);
  el('line', {x1:0,y1:0,x2:0,y2:-78, stroke:'#4361ee','stroke-width':5,'stroke-linecap':'round'}, minG);
  if(interactive){
    el('circle', {cy:-48, r:8, fill:'#e63946'}, hourG);
    el('circle', {cy:-78, r:8, fill:'#4361ee'}, minG);
    el('circle', {cy:-48, r:14, fill:'transparent', 'data-hand':'hour', style:'cursor:grab'}, hourG);
    el('circle', {cy:-78, r:14, fill:'transparent', 'data-hand':'min', style:'cursor:grab'}, minG);
  }
  el('circle', {r:6, fill:'#2b2d42'}, svg);

  const api = {
    hourAngle:0, minAngle:0, selected:'min', locked:false, onSelect:null,
    setHands(h, m){
      api.hourAngle = h; api.minAngle = m;
      hourG.setAttribute('transform', 'rotate(' + h + ')');
      minG.setAttribute('transform', 'rotate(' + m + ')');
    },
    setTime(H, M){ api.setHands(((H%12) + M/60)*30, M*6); },
    showGhost(H, M){
      gHour.setAttribute('transform', 'rotate(' + (((H%12)+M/60)*30) + ')');
      gMin.setAttribute('transform', 'rotate(' + (M*6) + ')');
      ghost.setAttribute('opacity', 1);
    },
    select(h){ api.selected = h; if(api.onSelect) api.onSelect(h); }
  };

  if(interactive){
    let drag = null;
    const angleFrom = e => {
      const r = svg.getBoundingClientRect();
      const x = e.clientX - (r.left + r.width/2), y = e.clientY - (r.top + r.height/2);
      let a = Math.atan2(x, -y) * 180/Math.PI;
      if(a < 0) a += 360;
      return a;
    };
    const move = (hand, a) => {
      if(hand === 'min') api.setHands(api.hourAngle, (Math.round(a/6)*6) % 360);
      else api.setHands(a % 360, api.minAngle);
      if(cb) cb(hand);
    };
    svg.addEventListener('pointerdown', e => {
      if(api.locked) return;
      const h = e.target.getAttribute && e.target.getAttribute('data-hand');
      if(h) api.select(h);
      drag = api.selected;
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      move(drag, angleFrom(e));
      e.preventDefault();
    });
    svg.addEventListener('pointermove', e => { if(drag && !api.locked) move(drag, angleFrom(e)); });
    const end = () => { drag = null; };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
  }
  return api;
}

/* ---------- Spielzustand ---------- */
let mode = 'read', tasks = [], idx = 0, score = 0;
let task = null, clock = null, resolved = false;

function randInt(n){ return Math.floor(Math.random()*n); }

function makeTasks(){
  let hMin = Math.max(1, Math.min(23, +S.hMin || 1));
  let hMax = Math.max(1, Math.min(23, +S.hMax || 23));
  if(hMin > hMax) [hMin, hMax] = [hMax, hMin];
  const hs = []; for(let h=hMin; h<=hMax; h++) hs.push(h);
  const ms = minuteChoices();
  const out = []; let prev = null;
  for(let i=0;i<S.total;i++){
    let h, m, tries = 0;
    do { h = hs[randInt(hs.length)]; m = ms[randInt(ms.length)]; tries++; }
    while(prev && prev.h === h && prev.m === m && tries < 20);
    const type = mode === 'mixed' ? (i%2 === 0 ? (Math.random()<.5?'read':'set') : (out[i-1].type==='read'?'set':'read')) : mode;
    prev = {h, m};
    out.push({type, h, m, attempts:0});
  }
  return out;
}

function show(id){
  ['menu','game','result'].forEach(s => { $('#'+s).hidden = (s !== id); });
  window.scrollTo(0,0);
}

function startGame(m){
  mode = m; tasks = makeTasks(); idx = 0; score = 0;
  show('game'); loadTask();
}

function setFeedback(text, cls){
  const f = $('#feedback');
  f.textContent = text; f.className = cls || 'info';
  if(cls === 'ok' || cls === 'bad'){ f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop'); }
}

function updateTop(){
  $('#progress').textContent = 'Aufgabe ' + (idx+1) + ' / ' + tasks.length;
  $('#score').textContent = '⭐ ' + score;
}

function loadTask(){
  task = tasks[idx]; resolved = false;
  updateTop(); setFeedback('', 'info');
  $('#btnCheck').textContent = 'Prüfen ✔';
  $('#btnCheck').disabled = false;
  $('#readUI').hidden = task.type !== 'read';
  $('#setUI').hidden = task.type !== 'set';

  if(task.type === 'read'){
    $('#prompt').innerHTML = 'Wie spät ist es?<br><small style="font-weight:400">Schreibe beide möglichen Uhrzeiten auf.</small>';
    clock = createClock($('#clockWrap'), false);
    clock.setTime(task.h, task.m);
    $$('.trow').forEach(r => { r.className = 'trow'; r.querySelectorAll('input').forEach(i => { i.value=''; i.disabled=false; }); });
    setTimeout(() => $('.trow .hh').focus(), 50);
  } else {
    $('#prompt').innerHTML = 'Stelle die Uhr ein auf<span class="digital">' + task.h + ':' + pad(task.m) + ' Uhr</span>';
    clock = createClock($('#clockWrap'), true, () => {});
    clock.onSelect = updateHandBtns;
    // Startposition: bewusst falsch
    let ha, ma, n = 0;
    do { ha = randInt(360); ma = randInt(60)*6; n++; }
    while(n < 100 && (r => r.minOk && r.hourOk)(evalSet(task.h, task.m, ha, ma, 'easy')));
    clock.setHands(ha, ma);
    clock.select('min');
  }
}

function updateHandBtns(h){
  $$('#handBtns button').forEach(b => b.classList.toggle('sel', b.dataset.hand === h));
}

/* ---------- Prüfen ---------- */
function award(){
  const pts = task.attempts === 0 ? 10 : 5;
  score += pts; updateTop();
  setFeedback(task.attempts === 0 ? '🎉 Super, richtig! +10 Punkte' : '👍 Richtig! +5 Punkte', 'ok');
  finishTask();
}

function finishTask(){
  resolved = true;
  if(clock) clock.locked = true;
  $$('.trow input').forEach(i => i.disabled = true);
  $('#btnCheck').textContent = idx === tasks.length-1 ? 'Ergebnis ➜' : 'Weiter ➜';
}

function giveUp(){
  setFeedback('Das war knapp daneben. So ist es richtig:', 'bad');
  if(task.type === 'read'){
    const exp = [{h:task.h%12, m:task.m}, {h:task.h%12+12, m:task.m}];
    $$('.trow').forEach((r,i) => {
      r.querySelector('.hh').value = exp[i].h; r.querySelector('.mm').value = pad(exp[i].m);
      r.className = 'trow ok';
    });
  } else {
    clock.showGhost(task.h, task.m);
  }
  finishTask();
}

function checkRead(){
  const rows = $$('.trow');
  const vals = rows.map(r => {
    const h = r.querySelector('.hh').value, m = r.querySelector('.mm').value;
    return {h: h===''?null:+h, m: m===''?null:+m};
  });
  if(vals.some(v => v.h === null || v.m === null)){
    setFeedback('Bitte fülle beide Uhrzeiten ganz aus.', 'info'); return;
  }
  const exp = [{h:task.h%12, m:task.m}, {h:task.h%12+12, m:task.m}];
  const used = [false,false];
  const ok = vals.map(v => {
    const hh = v.h === 24 ? 0 : v.h;
    for(let i=0;i<2;i++){
      if(!used[i] && exp[i].h === hh && exp[i].m === v.m){ used[i] = true; return true; }
    }
    return false;
  });
  rows.forEach((r,i) => r.className = 'trow ' + (ok[i] ? 'ok' : 'bad'));
  if(ok[0] && ok[1]) return award();
  task.attempts++;
  if(task.attempts >= 2) return giveUp();
  setFeedback('Fast! 💡 Der kurze rote Zeiger zeigt die Stunde, der lange blaue die Minuten. Nachmittags zählt man ab 12 weiter. Versuch es nochmal!', 'bad');
}

function checkSet(){
  const r = evalSet(task.h, task.m, clock.hourAngle, clock.minAngle, S.tol);
  if(r.minOk && r.hourOk) return award();
  task.attempts++;
  if(task.attempts >= 2) return giveUp();
  let msg;
  if(!r.minOk && !r.hourOk) msg = 'Beide Zeiger passen noch nicht. Versuch es nochmal!';
  else if(!r.minOk) msg = 'Der lange blaue Minutenzeiger passt noch nicht. Versuch es nochmal!';
  else msg = 'Der kurze rote Stundenzeiger passt noch nicht. Versuch es nochmal!';
  setFeedback(msg, 'bad');
}

function onCheck(){
  if(resolved){
    if(idx === tasks.length-1) return finishGame();
    idx++; return loadTask();
  }
  task.type === 'read' ? checkRead() : checkSet();
}

/* ---------- Ergebnis ---------- */
function bestKey(m){ return 'uhr-best-' + m; }
function getBest(m){ try{ return +localStorage.getItem(bestKey(m)) || 0; }catch(e){ return 0; } }

function finishGame(){
  const max = tasks.length*10, pct = score/max;
  const stars = pct >= .9 ? 3 : pct >= .6 ? 2 : 1;
  $('#stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  $('#finalScore').textContent = score + ' von ' + max + ' Punkten';
  let txt = pct >= .9 ? 'Fantastisch, du bist ein Uhren-Profi!' : pct >= .6 ? 'Sehr gut gemacht! Weiter so!' : 'Gut geübt – beim nächsten Mal wird es noch besser!';
  const prev = getBest(mode);
  if(score > prev && prev > 0) txt += ' 🏆 Neuer Bestwert!';
  if(score > prev){ try{ localStorage.setItem(bestKey(mode), score); }catch(e){} }
  $('#finalText').textContent = txt;
  show('result'); renderBest();
}

function renderBest(){
  ['read','set','mixed'].forEach(m => {
    const b = getBest(m);
    $('#best-' + m).textContent = b ? '🏆 Bestwert: ' + b + ' Punkte' : '';
  });
}

/* ---------- Eingabefelder ---------- */
$$('.trow input').forEach(inp => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0,2);
    const row = inp.closest('.trow');
    if(inp.classList.contains('hh')){
      if(inp.value.length === 2 || (inp.value.length === 1 && +inp.value > 2)) row.querySelector('.mm').focus();
    } else if(inp.value.length === 2){
      const next = row.nextElementSibling;
      if(next && next.classList.contains('trow')) next.querySelector('.hh').focus(); else inp.blur();
    }
  });
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); onCheck(); }
    if((e.key === ':' || e.key === '.') && inp.classList.contains('hh')){ e.preventDefault(); inp.closest('.trow').querySelector('.mm').focus(); }
  });
});

/* ---------- Events ---------- */
$$('.menu-btn').forEach(b => b.addEventListener('click', () => startGame(b.dataset.mode)));
$('#btnCheck').addEventListener('click', onCheck);
$('#btnQuit').addEventListener('click', () => { show('menu'); renderBest(); });
$('#btnAgain').addEventListener('click', () => startGame(mode));
$('#btnMenu').addEventListener('click', () => { show('menu'); renderBest(); });
$$('#handBtns button').forEach(b => b.addEventListener('click', () => { if(clock && !clock.locked) clock.select(b.dataset.hand); }));

/* Einstellungen */
const dlg = $('#dlg');
function fillDlg(){
  $('#setMinutes').value = S.minutes;
  $('#setHMin').value = S.hMin; $('#setHMax').value = S.hMax;
  $('#setTotal').value = String(S.total);
  $$('input[name=tol]').forEach(r => r.checked = r.value === S.tol);
}
function readDlg(){
  S.minutes = $('#setMinutes').value;
  S.hMin = Math.max(1, Math.min(23, parseInt($('#setHMin').value) || 1));
  S.hMax = Math.max(1, Math.min(23, parseInt($('#setHMax').value) || 23));
  if(S.hMin > S.hMax){ const t = S.hMin; S.hMin = S.hMax; S.hMax = t; }
  S.total = parseInt($('#setTotal').value) || 10;
  const t = $('input[name=tol]:checked'); if(t) S.tol = t.value;
  saveSettings();
}
$('#btnSettings').addEventListener('click', () => { fillDlg(); dlg.showModal(); });
$('#btnCloseDlg').addEventListener('click', () => { readDlg(); dlg.close(); });
$('#btnReset').addEventListener('click', () => { S = Object.assign({}, DEF); saveSettings(); fillDlg(); });
dlg.addEventListener('close', readDlg);

renderBest();

// Für Tests
window.__uhr = {evalSet, S};
})();
</script>
